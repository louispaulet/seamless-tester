<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seamless Texture Tester</title>
  <style>
    :root {
      --panel-bg: rgba(255, 250, 243, 0.94);
      --panel-fg: #1e293b;
      --panel-border: rgba(15, 23, 42, 0.08);
      --panel-shadow: 0 18px 40px rgba(2, 8, 23, 0.24);
      --tile-width: 256px;
      --tile-height: 256px;
      --texture-url: none;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(89, 142, 179, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(255, 196, 120, 0.12), transparent 32%),
        linear-gradient(180deg, #04111d 0%, #020b14 100%);
      color: white;
      font-family: "Avenir Next", "SF Pro Text", "Segoe UI", sans-serif;
    }

    .controls {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
      max-width: calc(100vw - 28px);
      padding: 12px;
      color: var(--panel-fg);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(14px);
    }

    .controls button {
      border: 0;
      border-radius: 999px;
      padding: 0.72rem 1rem;
      background: linear-gradient(180deg, #1f2a44, #111827);
      color: white;
      font: inherit;
      font-weight: 650;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    .controls button:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #263352, #172033);
    }

    .controls button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }

    .meta {
      display: grid;
      gap: 2px;
      min-width: 220px;
      margin-right: 2px;
      line-height: 1.2;
    }

    .meta strong {
      display: block;
      font-size: 13px;
      color: #0f172a;
    }

    .meta span {
      display: block;
      font-size: 12px;
      color: rgba(15, 23, 42, 0.72);
      font-variant-numeric: tabular-nums;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      padding: 0.55rem 0.78rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      color: #0f172a;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #fileInput {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      border: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .stage {
      padding: 96px 24px 24px;
    }

    .tile-grid {
      --tile-width: 256px;
      --tile-height: 256px;
      --texture-url: none;
      display: grid;
      grid-template-columns: repeat(10, var(--tile-width));
      grid-template-rows: repeat(10, var(--tile-height));
      width: calc(var(--tile-width) * 10);
      height: calc(var(--tile-height) * 10);
      margin: 0;
      padding: 0;
      line-height: 0;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.3);
    }

    .tile {
      width: var(--tile-width);
      height: var(--tile-height);
      background-image: var(--texture-url);
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 100% 100%;
      margin: 0;
      padding: 0;
      border: 0;
    }

    @media (max-width: 720px) {
      .controls {
        left: 10px;
        right: 10px;
        max-width: none;
      }

      .stage {
        padding: 118px 14px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="openButton" type="button">Open image</button>
    <button id="defaultButton" type="button" title="Return to the embedded local sample">Default</button>
    <button id="minusButton" type="button" title="Make tiles smaller">-</button>
    <button id="plusButton" type="button" title="Make tiles larger">+</button>
    <div class="meta" aria-live="polite">
      <strong id="sourceLabel">Default sample</strong>
      <span id="dimensionsLabel">256 x 256 px</span>
    </div>
    <span id="zoomLabel" class="pill">100%</span>
    <input id="fileInput" type="file" accept="image/*" />
  </div>

  <main class="stage">
    <div class="tile-grid" id="grid" role="img" aria-label="10 by 10 seamless texture preview"></div>
  </main>

  <script>
    const GRID_SIZE = 10;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 8;
    const SCALE_STEP = 1.1;
    const DEFAULT_TEXTURE_NAME = "Default sample";
    const DEFAULT_TEXTURE_WIDTH = 256;
    const DEFAULT_TEXTURE_HEIGHT = 256;

    const DEFAULT_TEXTURE_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
        <defs>
          <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.04"
              numOctaves="3"
              seed="17"
              stitchTiles="stitch"
            />
          </filter>
        </defs>
        <rect width="256" height="256" fill="#cdb79d" />
        <rect width="256" height="256" filter="url(#grain)" opacity="0.26" />
        <g opacity="0.14" fill="none" stroke="#7a5d45" stroke-width="4" stroke-linecap="round">
          <path d="M0 64H256M0 128H256M0 192H256" />
          <path d="M64 0V256M128 0V256M192 0V256" />
        </g>
        <g opacity="0.1" fill="#fff7eb">
          <circle cx="40" cy="42" r="7" />
          <circle cx="216" cy="48" r="9" />
          <circle cx="72" cy="176" r="8" />
          <circle cx="176" cy="212" r="6" />
          <circle cx="128" cy="128" r="10" />
        </g>
      </svg>
    `.trim();

    const openButton = document.getElementById("openButton");
    const defaultButton = document.getElementById("defaultButton");
    const minusButton = document.getElementById("minusButton");
    const plusButton = document.getElementById("plusButton");
    const fileInput = document.getElementById("fileInput");
    const sourceLabel = document.getElementById("sourceLabel");
    const dimensionsLabel = document.getElementById("dimensionsLabel");
    const zoomLabel = document.getElementById("zoomLabel");
    const grid = document.getElementById("grid");

    let currentScale = 1;
    let currentObjectUrl = null;
    let pendingLoadId = 0;

    function svgDataUrl(svg) {
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    const DEFAULT_TEXTURE_URL = svgDataUrl(DEFAULT_TEXTURE_SVG);

    function buildGrid() {
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < GRID_SIZE * GRID_SIZE; index += 1) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.setAttribute("aria-hidden", "true");
        fragment.appendChild(tile);
      }

      grid.replaceChildren(fragment);
    }

    function setGridTexture(textureUrl) {
      grid.style.setProperty("--texture-url", `url("${textureUrl}")`);
    }

    function setGridTileSize(width, height) {
      grid.style.setProperty("--tile-width", `${width}px`);
      grid.style.setProperty("--tile-height", `${height}px`);
    }

    function updateZoomLabel() {
      zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;
    }

    function clampScale(nextScale) {
      return Math.min(MAX_SCALE, Math.max(MIN_SCALE, nextScale));
    }

    function setScale(nextScale) {
      currentScale = clampScale(nextScale);
      setGridTileSize(
        Math.max(1, Math.round(activeTexture.width * currentScale)),
        Math.max(1, Math.round(activeTexture.height * currentScale))
      );
      updateZoomLabel();
    }

    function revokeCurrentObjectUrl() {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
    }

    const activeTexture = {
      name: DEFAULT_TEXTURE_NAME,
      width: DEFAULT_TEXTURE_WIDTH,
      height: DEFAULT_TEXTURE_HEIGHT,
      url: DEFAULT_TEXTURE_URL,
    };

    function renderTexture(texture) {
      activeTexture.name = texture.name;
      activeTexture.width = texture.width;
      activeTexture.height = texture.height;
      activeTexture.url = texture.url;

      sourceLabel.textContent = texture.name;
      dimensionsLabel.textContent = `${texture.width} x ${texture.height} px`;
      setGridTexture(texture.url);
      setScale(1);
    }

    function useDefaultTexture() {
      pendingLoadId += 1;
      revokeCurrentObjectUrl();
      fileInput.value = "";
      renderTexture({
        name: DEFAULT_TEXTURE_NAME,
        width: DEFAULT_TEXTURE_WIDTH,
        height: DEFAULT_TEXTURE_HEIGHT,
        url: DEFAULT_TEXTURE_URL,
      });
    }

    function loadImageDimensions(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          resolve({
            width: image.naturalWidth || DEFAULT_TEXTURE_WIDTH,
            height: image.naturalHeight || DEFAULT_TEXTURE_HEIGHT,
          });
        };
        image.onerror = () => reject(new Error("Unable to load image."));
        image.src = url;
      });
    }

    async function useSelectedFile(file) {
      const loadId = ++pendingLoadId;
      const objectUrl = URL.createObjectURL(file);

      try {
        const dimensions = await loadImageDimensions(objectUrl);
        if (loadId !== pendingLoadId) {
          URL.revokeObjectURL(objectUrl);
          return;
        }
        revokeCurrentObjectUrl();
        currentObjectUrl = objectUrl;
        renderTexture({
          name: file.name,
          width: dimensions.width,
          height: dimensions.height,
          url: objectUrl,
        });
      } catch (error) {
        URL.revokeObjectURL(objectUrl);
        if (loadId !== pendingLoadId) {
          return;
        }
        console.error(error);
        sourceLabel.textContent = "Could not load image";
        dimensionsLabel.textContent = "Please choose another file";
      }
    }

    openButton.addEventListener("click", () => {
      fileInput.value = "";
      fileInput.click();
    });

    defaultButton.addEventListener("click", useDefaultTexture);

    minusButton.addEventListener("click", () => {
      setScale(currentScale / SCALE_STEP);
    });

    plusButton.addEventListener("click", () => {
      setScale(currentScale * SCALE_STEP);
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        return;
      }

      useSelectedFile(file);
    });

    buildGrid();
    setGridTexture(DEFAULT_TEXTURE_URL);
    setScale(1);
  </script>
</body>
</html>
